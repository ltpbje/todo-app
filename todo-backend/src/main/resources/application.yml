spring:
  datasource:
    url: jdbc:mysql://localhost:3306/todo_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  # ponytail: demo-level secret; override via env var JWT_SECRET in production
  secret: ${JWT_SECRET:change-me-please-32-bytes-min-secret-key!!}
  expire-ms: 86400000

server:
  port: 8080
